name: Temporary privacy and security regression verification

on:
  push:
    branches:
      - test/float-share-dialog-current-main

permissions:
  contents: read

jobs:
  privacy-security:
    name: Privacy and security regression tests (Bun 1.3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up canonical Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Run privacy and security regression suite
        run: bun test src/lib/privacy-security.test.ts
