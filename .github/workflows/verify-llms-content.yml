name: Temporary llms.txt verification

on:
  push:
    branches:
      - fix/mark-planned-products-not-live

permissions:
  contents: read

jobs:
  llms-content:
    name: Bun 1.3.14 llms.txt tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Confirm Bun version
        run: test "$(bun --version)" = "1.3.14"
      - name: Run focused llms.txt tests
        run: bun test src/lib/llms-content.test.ts
