name: Temporary llms.txt regression verification

on:
  push:
    branches:
      - fix/mark-planned-products-not-live
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/llms-content.ts"
      - "src/lib/llms-content.test.ts"
      - "src/routes/llms[.]txt.ts"
      - ".github/workflows/verify-llms-content.yml"

permissions:
  contents: read

concurrency:
  group: verify-llms-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llms-content:
    name: Generated llms.txt tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run generated llms.txt tests
        run: bun test src/lib/llms-content.test.ts
