name: Verify Float share-dialog regression tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  float-share-tests:
    name: Float share-dialog and payload tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run focused Float tests
        run: bun test src/components/float/FloatPlanner.test.ts src/lib/float-share.test.ts
