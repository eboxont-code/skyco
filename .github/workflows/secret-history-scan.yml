name: Historical secret scan

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/secret-history-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan current Git history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan every reachable ref with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git . --log-opts=--all --redact=100 --no-banner
