name: Temporary SEO regression verification

on:
  push:
    branches:
      - test/sitemap-registry-coverage

permissions:
  contents: read

jobs:
  seo-regressions:
    name: Bun SEO regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Verify Bun version
        run: bun --version
      - name: Run focused SEO regression tests
        run: bun test src/lib/sitemap.test.ts src/lib/product-seo.test.ts
