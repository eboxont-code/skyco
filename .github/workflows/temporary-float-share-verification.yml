name: Temporary Float share regression verification

on:
  push:
    branches:
      - test/float-share-dialog-current-main

permissions:
  contents: read

jobs:
  float-share-tests:
    name: Float share tests (Bun 1.3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up canonical Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Confirm Bun version
        run: test "$(bun --version)" = "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run focused Float regression tests
        run: bun test src/components/float/FloatPlanner.test.ts src/lib/float-share.test.ts
