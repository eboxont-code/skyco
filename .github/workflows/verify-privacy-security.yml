name: Temporary privacy disclosure test

on:
  push:

permissions:
  contents: read

jobs:
  privacy-security-tests:
    name: Privacy and security disclosure tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Run privacy and security regression suite
        run: bun test src/lib/privacy-security.test.ts
